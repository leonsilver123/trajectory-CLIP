# ============================================================
# 交通风险感知子系统 - Docker Compose 服务编排
# ============================================================
# 使用方式：在项目根目录执行 `docker compose up -d`
# 所有 volume 均使用相对路径，相对本文件所在目录（项目根）解析，
# 因此换机器/换盘符无需修改任何路径。
# ============================================================

services:
  # ----------------------------------------------------------
  # 后端 API 服务 (FastAPI + CUDA)
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: traffic-backtrack-backend
    ports:
      - "8000:8000"
    volumes:
      # 挂载点必须是容器内的 /app/xxx，不能是 /xxx：
      # 后端代码统一以“项目根目录”解析路径 ——
      #   api/routes/search.py:  _PROJECT_ROOT = Path(__file__).resolve().parent.parent.parent (= /app)
      #                          _OUTPUT_DIR = /app/output, CLIP 模型 download_root = /app/models
      #   api/main.py:           静态目录 /static -> /app/output
      #   src/common/logger.py:  log_dir 默认 "logs"（相对工作目录 WORKDIR=/app）-> /app/logs
      #   configs/default.yaml:  data_dir/model_dir/output_dir/log_dir 均为相对项目根路径
      # 若挂到 /models、/output 这类根目录，容器内代码读不到，检索功能会静默退化。
      - ./data:/app/data        # 数据集目录（仓库内已存在）
      - ./models:/app/models    # 模型权重（~870MB，被 .dockerignore 排除，只能靠 volume 挂载）
      - ./output:/app/output    # 检索结果 JSON + FAISS 索引（~250MB，同样只靠 volume 挂载）
      - ./logs:/app/logs        # 运行日志（仓库内已存在，日志文件由容器运行时写入）
    environment:
      - CUDA_VISIBLE_DEVICES=0
      # QDRANT_HOST/PORT 保留仅为将来启用 Qdrant 时不用改；当前没有任何代码读取它们
      # （在线检索用 FAISS，见文件末尾 qdrant 段的说明）
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PYTHONPATH=/app
    env_file:
      # 依赖仓库内已存在的 docker/.env；缺失时 compose 会直接报错
      - docker/.env
    # 原先这里有 `depends_on: qdrant`。qdrant 服务已注释停用，
    # 若保留该依赖，`docker compose up` 会因引用了不存在的服务而直接失败。
    # 将来启用 qdrant 时把这段恢复即可：
    # depends_on:
    #   qdrant:
    #     condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - traffic-net

  # ----------------------------------------------------------
  # 前端服务 —— **不单独起容器**
  #
  # 前端已于 2026-09-21 统一为 `webapp/`（React + Vite + antd）。
  # 它的构建产物 `webapp/dist/` 由 **backend 同源托管**（见 api/main.py::_mount_frontend），
  # 因此访问 http://<host>:8000/ 即是完整界面，无需第二个容器、也无需 8501 端口。
  #
  # 之前的 Streamlit 前端（`frontend/`）及其 Dockerfile.frontend 已下线删除。
  #
  # 部署前记得先构建前端产物：
  #     cd webapp && npm ci && npm run build
  #

  # ----------------------------------------------------------
  # Qdrant 向量数据库 —— **当前未接线，默认不启动**
  #
  # 状态（PLAN3-F4，2026-09-20 实测）：项目里**没有任何消费者**。
  #   - 在线检索走的是 FAISS：output/clip_vectors.faiss（IndexFlatIP，68,349×512）
  #   - src/retrieval/vector_recall.py 有 Qdrant 实现，但该包不在在线路径上
  #     （原先接线的 api/dependencies.py 是未使用的骨架，已于 2026-09-21 删除）
  #   - configs/default.yaml 的 retrieval.qdrant.enabled 已标为 false
  #
  # 保留这段配置是为了将来真要启用时不必重写；但它此前会白起一个容器、
  # 占 6333/6334 端口、挂载 461MB 历史数据目录，并且让人误以为向量库是 Qdrant。
  # 启用步骤：取消下面注释 → 把 retrieval.vector_db 改回 qdrant →
  #          让检索路由改用 src/retrieval/vector_recall.py。
  #
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: traffic-backtrack-qdrant
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - ./docker/qdrant_storage:/qdrant/storage
  #   environment:
  #     - QDRANT__SERVICE__GRPC_PORT=6334
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "20m"
  #       max-file: "3"
  #   restart: unless-stopped
  #   networks:
  #     - traffic-net

# ----------------------------------------------------------
# 网络
# ----------------------------------------------------------
networks:
  traffic-net:
    driver: bridge

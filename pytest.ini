[pytest]
# 只收集 tests/ 下的测试；否则 pytest 会递归扫描 .venv/ 与 output/（上百 MB），
# 仅收集阶段就要 7 分钟以上。
testpaths = tests
# 根目录下的 test_backtrack.py 是手写脚本（import 时即请求本机 API 并 exit(1)），
# 不是 pytest 用例，已由 testpaths 排除；如手动指定路径仍需注意。
norecursedirs = .venv venv output models data cityflow .git .agents .codex .tmp-render
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# langsmith 的用户级(非本 venv) pytest 插件会被自动加载，而它的依赖链
# (requests_toolbelt / zstandard / sniffio / distro / ...) 在本 venv 里并不完整，
# 一加载就 ModuleNotFoundError、整个测试会话起不来。这里按 entry point 名
# (`langsmith_plugin`) 显式禁用；不用 PYTHONNOUSERSITE，那会改变 sys.path
# 并让 CLIP 打分静默归零（见 memory: pythonnousersite-breaks-clip）。
addopts = -ra -p no:langsmith_plugin

[pytest]
# 只收集 tests/ 下的测试；否则 pytest 会递归扫描 .venv/ 与 output/（上百 MB），
# 仅收集阶段就要 7 分钟以上。
testpaths = tests
# 根目录下的 test_backtrack.py 是手写脚本（import 时即请求本机 API 并 exit(1)），
# 不是 pytest 用例，已由 testpaths 排除；如手动指定路径仍需注意。
norecursedirs = .venv venv output models data cityflow .git .agents .codex .tmp-render
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra

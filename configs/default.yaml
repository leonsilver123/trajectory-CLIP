# ============================================================
# 交通风险感知子系统 - 系统默认配置
# 文本驱动的交通目标检索与跨镜时空回溯
# ============================================================

# 系统配置
system:
  name: "TrafficSpatioTemporalBacktrack"
  version: "1.0.0"
  device: "cuda"                    # cuda / cpu
  data_dir: "cityflow/AICity22_Track1_MTMC_Tracking"
  model_dir: "models"
  output_dir: "output"
  log_dir: "logs"
  log_level: "INFO"                 # DEBUG / INFO / WARNING / ERROR

# 区域配置（AICity22 Track1 MTMC Tracking - Iowa, USA）
region:
  name: "AICity22 CityScale"        # 区域名称
  center_lat: 42.50                 # 区域中心纬度 (Iowa area)
  center_lon: -90.71                # 区域中心经度
  plate_prefix: "IA"                # 车牌前缀
  default_coordinate:               # 默认坐标（当摄像头元数据缺失时使用）
    latitude: 42.4988
    longitude: -90.6864

# 摄像头配置
camera:
  metadata_file: "configs/cityflow_camera_metadata.yaml"
  default_search_radius_km: 5.0
  default_prefix: "c"             # 摄像头 ID 默认前缀
  fps: 10                          # 默认帧率 (c015 为 8 FPS)
  total_cameras: 46                # 总摄像头数
  scenes:                          # 场景定义
    - scene_id: "S01"
      name: "Training Scene 1"
      split: "train"
      cameras: ["c001", "c002", "c003", "c004", "c005"]
      gps_center: [42.525678, -90.723601]
    - scene_id: "S02"
      name: "Validation Scene 2"
      split: "validation"
      cameras: ["c006", "c007", "c008", "c009"]
      gps_center: [42.491916, -90.723723]
    - scene_id: "S03"
      name: "Training Scene 3"
      split: "train"
      cameras: ["c010", "c011", "c012", "c013", "c014", "c015"]
      gps_center: [42.498780, -90.686393]
    - scene_id: "S04"
      name: "Training Scene 4"
      split: "train"
      cameras: ["c016", "c017", "c018", "c019", "c020", "c021", "c022", "c023", "c024", "c025", "c026", "c027", "c028", "c029", "c030", "c031", "c032", "c033", "c034", "c035", "c036", "c037", "c038", "c039", "c040"]
      gps_center: [42.498780, -90.686393]
    - scene_id: "S05"
      name: "Validation Scene 5"
      split: "validation"
      cameras: ["c016", "c010", "c017", "c018", "c019", "c020", "c021", "c022", "c023", "c024", "c025", "c026", "c027", "c028", "c029", "c033", "c034", "c035", "c036"]
      gps_center: [42.498780, -90.686393]
    - scene_id: "S06"
      name: "Test Scene 6"
      split: "test"
      cameras: ["c041", "c042", "c043", "c044", "c045", "c046"]
      gps_center: [42.492448, -90.723343]

# 数据格式与访问方式
data_format:
  video_source: "vdo.avi"            # 视频文件名（每个摄像头目录下）
  annotation_format: "mot"           # MOT标准格式: frame,id,left,top,width,height,conf,class,visibility
  train_split: "train"               # 训练集目录
  validation_split: "validation"     # 验证集目录
  test_split: "test"                 # 测试集目录
  label_files:                       # 标注文件路径模板
    ground_truth: "{split}/{scene}/{camera}/gt/gt.txt"
    detection: "{split}/{scene}/{camera}/det/det.txt"
  roi_mask: "{split}/{scene}/{camera}/roi.jpg"
  calibration: "{split}/{scene}/{camera}/calibration.txt"
  cam_timestamp_file: "cam_timestamp/{scene}.txt"   # 每场景一个文件
  cam_framenum_file: "cam_framenum/{scene}.txt"     # 每场景一个文件
  cam_loc_map: "cam_loc/{scene}.png"                # 场景级地图(无per-camera GPS)

# 跨摄时间对齐（T5）
# cityflow_results.json 里的 timestamp 是各摄像头自己的本地时间（每路都从
# 2020-01-01 00:00:00 附近起跳），跨摄像头直接相减会得到无意义的负值。
# cam_timestamp/{scene}.txt 给出每个摄像头的全局起始偏移（秒）:
#     全局时间 = 本地时间 + 该摄像头偏移
# 只作用于"跨摄像头时间差"(actual_travel_time / 跨镜总时长 / 摄像头先后排序)，
# 每个检测自身的 timestamp 字段仍保持本机时间；全局时间作为新增字段输出。
# 文件路径 = system.data_dir + data_format.cam_timestamp_file（按场景填充）。
time_alignment:
  enabled: true                       # 置 false 则完全退回本机时间（不做换算）

# 目标检测配置
detection:
  model: "yolov8x"                  # ultralytics YOLO 模型名
  confidence_threshold: 0.5
  nms_threshold: 0.45
  target_classes:
    - vehicle                       # 机动车
    - pedestrian                    # 行人
    - non_motor_vehicle             # 非机动车
  input_size: [640, 640]

# 单摄跟踪配置
tracking:
  algorithm: "bytetrack"            # bytetrack / botsort / deepsort
  max_age: 30                       # 最大丢失帧数
  min_hits: 3                       # 最小命中帧数
  iou_threshold: 0.3                # IOU 匹配阈值

# 属性识别
attribute:
  vehicle_attributes:
    - color                         # 车身颜色
    - vehicle_type                  # 车辆类型(轿车/SUV/卡车等)
  pedestrian_attributes:
    - gender                        # 性别外观
    - clothing_color                # 上衣颜色
    - bag                           # 是否背包
    - bag_color                     # 背包颜色

# 车牌OCR
plate_ocr:
  enabled: true
  model_path: null                  # null 表示使用预训练模型
  confidence_threshold: 0.7

# 特征提取
#
# ⚠️ 下面的 feature.* 与 retrieval.* 段目前**没有任何代码读取**
# （实测：全仓对 `feature.clip` / `feature.reid` / `retrieval.clip_model` /
# `retrieval.vector_db` / `retrieval.top_k` 的引用数均为 0）。
# 它们描述的是**设计口径**，改这里不会改变运行时行为 ——
# 实际生效的模型与索引在 api/routes/search.py 里（见下方注释）。
# 保留本段是为了记录设计意图；接入前请勿把它当作开关。
feature:
  reid:
    model: "fast-reid SBS R50-ibn"  # 实际生效：scripts/extract_reid.py（三权重集成）
    vector_dim: 2048                # 实测为**检测级 2048 维**（非 512）
    batch_size: 32
  clip:
    # 实际生效的是 Chinese-CLIP **ViT-B-16 / 512 维**（api/routes/search.py:101-122，
    # 经 cn_clip.load_from_name("ViT-B-16")），**不是** ViT-L-14 / 768 维。
    # 两套向量曾长期混用，已于 scripts/unify_clip_949.py + merge_clip_unified.py 统一为 512。
    model: "CN-CLIP-ViT-B-16"
    vector_dim: 512
    batch_size: 16

# 质量评分
quality:
  min_score: 0.3                    # 最低质量阈值
  weights:
    clarity: 0.3                    # 清晰度权重
    completeness: 0.3               # 完整度权重
    occlusion: 0.2                  # 遮挡率权重
    detection_conf: 0.2             # 检测置信度权重

# 跨镜拼接
stitching:
  max_time_gap_seconds: 600         # 最大时间间隔(秒)
  min_appearance_score: 0.95        # 最低外观相似度（P-B 实测 0.6 太低会放行异车；0.95 精度≈0.97）
  spatial_search_radius_km: 10.0    # 空间搜索半径(公里)
  weights:
    vehicle:
      plate: 0.35                   # 车牌一致性
                                    # ⚠️ 本数据集**零车牌覆盖**（实测 68,349 条检测中
                                    # 带 plate_number 的为 0 条），因此这一维恒为"无证据"、
                                    # 每次评分都被 reweight_missing_dimensions 整维剔除。
                                    # 也就是说这个权重在当前数据上是**理论值**，
                                    # 实际不参与打分。等真实车牌可用时它才会生效。
      temporal: 0.40                # 时间可达性（P-A 实测最可靠，调高）
      topology: 0.15                # 摄像头拓扑
      reid: 0.0                     # ReID 外观（P-A 实测软评分权重是噪声→置零；外观仍由规则8硬门控过滤）
      attribute: 0.0                # 属性一致性（P-A 实测跨镜一致率仅28-37%，软评分是噪声→置零；仍由规则7硬门控）
      # 上面五项之和为 0.90；余下 0.10 由方向一致性加分项补齐
      # （scoring.py 的 DIRECTION_BONUS_WEIGHT，恒定计入、不参与归一化），
      # 因此总分上限恰为 1.00。
      #
      # 实测当前数据上的**生效权重**（scoring.explain_dimensions）：
      #   temporal 0.6545 / topology 0.2455，plate 被剔除。
      # 即"六维评分函数"在本数据集上实际退化为「时间可达性 + 路网拓扑 + 方向」三项。
    pedestrian:
      temporal: 0.35                # 时空可达性
      reid: 0.30                    # ReID 外观
      attribute: 0.25               # 服饰属性
      bag: 0.10                     # 背包属性
  penalties:
    path_divergence: 0.1            # 路径分叉惩罚
    observation_missing: 0.05       # 观测缺失惩罚
  # 某个分项"没有证据"时（如双方都没有 ReID 向量 / 都没有车牌），该维度恒为
  # 中性分 0.5，按原权重算进总分只会给所有候选加上同一个常数偏移、白白压缩
  # 区分度。true = 剔除该维度并把权重按比例分摊给有证据的维度（权重总和不变，
  # 不放大任何单个分项）；false = 退回旧行为（中性分 × 原权重直接求和）。
  reweight_missing_dimensions: true

# 文本检索
#
# ⚠️ 同 feature 段：本段**没有任何代码读取**，描述的是设计口径而非开关。
# 在线检索的实际行为见 api/routes/search.py：
#   - 向量库是 **FAISS**（output/clip_vectors.faiss，IndexFlatIP，68,349×512），
#     不是 Qdrant。Qdrant 在 docker-compose 里起了容器，但**没有任何消费者**（PLAN3-F4）。
#   - 融合权重是硬编码的 ALPHA=0.6：final = 0.6*clip_score + 0.4*attr_score。
retrieval:
  top_k: 20                         # 设计口径：返回候选数（实际由路由内部分页控制）
  vector_db: "faiss"                # 实际生效的向量库
  faiss:
    index_file: "output/clip_vectors.faiss"   # IndexFlatIP，68,349 × 512
    metric: "inner_product"                   # 向量已 L2 归一化，内积等价余弦
  # Qdrant 接入骨架：保留配置以便将来启用，当前**未接线**
  qdrant:
    enabled: false
    host: "localhost"
    port: 6333
    collection_name: "traffic_targets"
  clip_model: "CN-CLIP-ViT-B-16"    # 实际生效（非 ViT-L-14）
  rerank_top_n: 5                   # 设计口径：重排后返回数量

# 轨迹回溯
backtrack:
  max_upstream_depth: 10            # 最大上游回溯深度
  max_downstream_depth: 10          # 最大下游回溯深度
  min_confidence_threshold: 0.5     # 最低置信度阈值
  max_results: 50                   # 最大返回结果数

# API 配置
api:
  # 监听地址。默认 127.0.0.1（仅本机可访问）—— 本服务无鉴权，
  # 改成 0.0.0.0 会让同局域网内任何人都能访问，需自行评估暴露风险。
  # 容器部署不受影响：Dockerfile.backend 显式传 --host 0.0.0.0。
  host: "127.0.0.1"
  port: 8000
  workers: 2
  cors_origins: ["*"]
  debug: false

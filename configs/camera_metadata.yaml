# ============================================================
# 摄像头元数据配置
# 数据源: AICity22 Track1 MTMC Tracking (CityFlowV2)
# 共 46 个摄像头 (c001-c046), 分布在 6 个场景 (S01-S06)
#
# 完整摄像头数据见: configs/cityflow_camera_metadata.yaml
# 本文件为精简索引, 系统默认加载 cityflow_camera_metadata.yaml
# (由 configs/default.yaml -> camera.metadata_file 指定)
#
# GPS坐标为场景级近似值(数据集未提供精确per-camera GPS)
# 视频格式: 每个摄像头目录下 vdo.avi (非图片目录)
# 标注格式: MOT标准 (frame,id,left,top,width,height,conf,class,visibility)
# ============================================================

# 场景-摄像头映射 (65个摄像头-场景对, 46个唯一摄像头ID)
scenes:
  - scene_id: S01
    split: train
    cameras: [c001, c002, c003, c004, c005]
    gps_center: [42.525678, -90.723601]
    loc_map: cam_loc/S01.png

  - scene_id: S02
    split: validation
    cameras: [c006, c007, c008, c009]
    gps_center: [42.491916, -90.723723]
    loc_map: cam_loc/S02.png

  - scene_id: S03
    split: train
    cameras: [c010, c011, c012, c013, c014, c015]
    gps_center: [42.498780, -90.686393]
    loc_map: cam_loc/S0345.png

  - scene_id: S04
    split: train
    cameras: [c016, c017, c018, c019, c020, c021, c022, c023, c024, c025,
              c026, c027, c028, c029, c030, c031, c032, c033, c034, c035,
              c036, c037, c038, c039, c040]
    gps_center: [42.498780, -90.686393]
    loc_map: cam_loc/S0345.png

  - scene_id: S05
    split: validation
    cameras: [c016, c010, c017, c018, c019, c020, c021, c022, c023, c024,
              c025, c026, c027, c028, c029, c033, c034, c035, c036]
    gps_center: [42.498780, -90.686393]
    loc_map: cam_loc/S0345.png

  - scene_id: S06
    split: test
    cameras: [c041, c042, c043, c044, c045, c046]
    gps_center: [42.492448, -90.723343]
    loc_map: cam_loc/S06.png

# 摄像头数据路径模板 (相对于 data_dir)
# 视频: {split}/{scene}/{camera}/vdo.avi
# 标注: {split}/{scene}/{camera}/gt/gt.txt (train/validation)
# 检测: {split}/{scene}/{camera}/det/det.txt
# ROI:  {split}/{scene}/{camera}/roi.jpg
# 标定: {split}/{scene}/{camera}/calibration.txt

# 帧率: 10 FPS (S03/c015 例外为 8 FPS)
# 帧数: 各摄像头不同 (210-4299帧), 详见 cityflow_camera_metadata.yaml
# 时间戳: 按场景组织在 cam_timestamp/{scene}.txt
